<div class="contianer">
    <h2>Products</h2>
    <button *ngIf="isAdmin" mat-raised-button color="primary" (click)="addProduct()">Add Product</button>
    <table mat-table [dataSource]="products">
        <ng-container matColumnDef="productId">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let product">
              {{ product.productId }}
            </td>
          </ng-container>
          <ng-container matColumnDef="productName">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let product">
              {{ product.productName }}
            </td>
          </ng-container>
          <ng-container matColumnDef="retailPrice">
            <th mat-header-cell *matHeaderCellDef>Price</th>
            <td mat-cell *matCellDef="let product">
              {{ product.retailPrice | currency }}
            </td>
          </ng-container>
          <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef>Stock</th>
            <td mat-cell *matCellDef="let product">
              {{ product.quantity }}
            </td>
          </ng-container>
          <ng-container matColumnDef="wholesalePrice">
            <th mat-header-cell *matHeaderCellDef>WholeSale Price</th>
            <td mat-cell *matCellDef="let product">
              {{ product.wholesalePrice | currency }}
            </td>
          </ng-container>
                <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let product">
              <button mat-button
                (click)="viewProduct(product.productId)">
                View
              </button>
              <ng-container *ngIf="!isAdmin">
                <button mat-button
                  (click)="addToCart(product)">
                  Add to Cart
                </button>
                <button mat-button
                  (click)="addToWatchList(product.productId)">
                  Watchlist
                </button>
              </ng-container>
              <button *ngIf="isAdmin"
                mat-button
                (click)="editProduct(product.productId)">
                Edit
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <p *ngIf="products.length === 0 && !errorMessage">No products available.</p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    <p *ngIf="message">{{ message }}</p>
</div>
