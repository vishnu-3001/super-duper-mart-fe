
<div class="container">

    <h2>My Watchlist</h2>
  
    <p *ngIf="isLoading">
      Loading watchlist...
    </p>
  
    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>
  
    <p *ngIf="successMessage">
      {{ successMessage }}
    </p>
  
    <table
      mat-table
      [dataSource]="products"
      *ngIf="!isLoading">
  
      <!-- PRODUCT ID -->
      <ng-container matColumnDef="productId">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let product">
          {{ product.productId }}
        </td>
      </ng-container>
  
      <!-- PRODUCT NAME -->
      <ng-container matColumnDef="productName">
        <th mat-header-cell *matHeaderCellDef>
          Product Name
        </th>
        <td mat-cell *matCellDef="let product">
          {{ product.productName }}
        </td>
      </ng-container>
  
      <!-- RETAIL PRICE -->
      <ng-container matColumnDef="retailPrice">
        <th mat-header-cell *matHeaderCellDef>
          Price
        </th>
        <td mat-cell *matCellDef="let product">
          {{ product.retailPrice | currency }}
        </td>
      </ng-container>
  
      <!-- ACTIONS -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>
  
        <td mat-cell *matCellDef="let product">
  
          <button
            mat-button
            color="primary"
            (click)="viewProduct(product.productId)">
            View
          </button>
  
          <button
            mat-button
            color="warn"
            [disabled]="removingProductId !== null"
            (click)="removeProduct(product.productId)">
            Remove
          </button>
  
        </td>
      </ng-container>
  
      <tr mat-header-row
        *matHeaderRowDef="displayedColumns"></tr>
  
      <tr mat-row
        *matRowDef="let row; columns: displayedColumns"></tr>
  
    </table>
  
    <p *ngIf="!isLoading && !errorMessage && products.length === 0">
      Your watchlist is empty.
    </p>
  
  </div>
